<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mycelial Space Coordination</title>

    <style>
        body {
            margin: 0;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 30px 20px 10px;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #aeb6c7;
        }

        .simulation {
            width: 90%;
            max-width: 1100px;
            height: 550px;
            margin: 30px auto;
            background: #0e1422;
            border: 1px solid #293249;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .controls {
            margin: 20px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
            color: #080b14;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .metrics {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px auto;
            max-width: 1100px;
        }

        .metric {
            background: #0e1422;
            border: 1px solid #293249;
            border-radius: 12px;
            padding: 20px;
            min-width: 180px;
        }

        .metric h3 {
            margin: 0 0 10px;
            color: #aeb6c7;
            font-size: 14px;
        }

        .metric span {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Mycelial Space Coordination</h1>

    <p>
        Centralized spacecraft coordination vs.
        distributed mycelium-inspired coordination
    </p>
</header>


<div class="controls">

    <button onclick="startSimulation()">
        Run Simulation
    </button>

</div>


<div class="simulation">

    <canvas id="spaceCanvas"></canvas>

</div>


<div class="metrics">

    <div class="metric">
        <h3>Architecture</h3>
        <span id="architecture">
            Waiting
        </span>
    </div>

    <div class="metric">
        <h3>Simulation Step</h3>
        <span id="step">
            0
        </span>
    </div>

    <div class="metric">
        <h3>Minimum Separation</h3>
        <span id="distance">
            --
        </span>
    </div>

    <div class="metric">
        <h3>Maneuver Cost</h3>
        <span id="cost">
            --
        </span>
    </div>

</div>


<script>

const canvas =
    document.getElementById("spaceCanvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


// --------------------------------------------------
// SPACECRAFT
// --------------------------------------------------

let spacecraft = [

    {
        x: -10,
        y: 0,
        vx: 0.10,
        vy: 0
    },

    {
        x: 10,
        y: 0.2,
        vx: -0.10,
        vy: 0
    },

    {
        x: 0,
        y: 8,
        vx: 0,
        vy: -0.02
    }

];


// --------------------------------------------------
// SIMULATION STATE
// --------------------------------------------------

let running = false;

let step = 0;

let architecture =
    "Mycelium + Hyperbolic";


// --------------------------------------------------
// COORDINATE CONVERSION
// --------------------------------------------------

function screenX(x) {

    return canvas.width / 2 +
           x * 20;

}


function screenY(y) {

    return canvas.height / 2 -
           y * 20;

}


// --------------------------------------------------
// DRAW NETWORK
// --------------------------------------------------

function drawNetwork() {

    ctx.lineWidth = 1;

    for (
        let i = 0;
        i < spacecraft.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < spacecraft.length;
            j++
        ) {

            const a =
                spacecraft[i];

            const b =
                spacecraft[j];

            const distance =
                Math.hypot(
                    a.x - b.x,
                    a.y - b.y
                );

            if (distance < 15) {

                ctx.beginPath();

                ctx.moveTo(
                    screenX(a.x),
                    screenY(a.y)
                );

                ctx.lineTo(
                    screenX(b.x),
                    screenY(b.y)
                );

                ctx.strokeStyle =
                    "rgba(255,255,255,0.25)";

                ctx.stroke();
            }
        }
    }
}


// --------------------------------------------------
// DRAW SPACECRAFT
// --------------------------------------------------

function drawSpacecraft() {

    spacecraft.forEach(
        (s, index) => {

            const x =
                screenX(s.x);

            const y =
                screenY(s.y);


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                8,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "white";

            ctx.fill();


            ctx.fillStyle =
                "#aeb6c7";

            ctx.font =
                "12px Arial";

            ctx.fillText(
                "SC-" + (index + 1),
                x + 12,
                y - 12
            );
        }
    );
}


// --------------------------------------------------
// DRAW
// --------------------------------------------------

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawNetwork();

    drawSpacecraft();
}


// --------------------------------------------------
// SIMULATION
// --------------------------------------------------

function simulationStep() {

    if (!running)
        return;


    step++;


    spacecraft.forEach(
        s => {

            s.x += s.vx;

            s.y += s.vy;

        }
    );


    let minimumDistance =
        Infinity;


    for (
        let i = 0;
        i < spacecraft.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < spacecraft.length;
            j++
        ) {

            const distance =
                Math.hypot(
                    spacecraft[i].x -
                    spacecraft[j].x,

                    spacecraft[i].y -
                    spacecraft[j].y
                );


            minimumDistance =
                Math.min(
                    minimumDistance,
                    distance
                );
        }
    }


    document.getElementById(
        "architecture"
    ).textContent =
        architecture;


    document.getElementById(
        "step"
    ).textContent =
        step;


    document.getElementById(
        "distance"
    ).textContent =
        minimumDistance.toFixed(3);


    document.getElementById(
        "cost"
    ).textContent =
        (step * 0.01).toFixed(3);


    draw();


    if (step < 300) {

        requestAnimationFrame(
            simulationStep
        );

    } else {

        running = false;

    }
}


// --------------------------------------------------
// START
// --------------------------------------------------

function startSimulation() {

    spacecraft = [

        {
            x: -10,
            y: 0,
            vx: 0.10,
            vy: 0
        },

        {
            x: 10,
            y: 0.2,
            vx: -0.10,
            vy: 0
        },

        {
            x: 0,
            y: 8,
            vx: 0,
            vy: -0.02
        }

    ];


    step = 0;

    running = true;

    simulationStep();
}


draw();

</script>

</body>
</html>
